<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>{Judul}</title>
</head>
<body style="margin: 0; padding: 0; background-color: #f6f6f6; font-family: sans-serif;">
    <table width="100%" border="0" cellspacing="0" cellpadding="0" style="background-color: #f6f6f6; padding: 20px;">
        <tr>
            <td align="center">
                <table width="500" border="0" cellspacing="0" cellpadding="0" style="background-color: #ffffff; border: 1px solid #e9e9e9; padding: 20px;">
                    
                    <tr>
                        <td align="center" style="padding-bottom: 15px;">
                            <a href="{LinkDetail}" target="_blank">
                                <img src="{UrlGambar}" alt="Blog Photo" width="100%" style="display: block; max-width: 100%; height: auto; border: 0;">
                            </a>
                        </td>
                    </tr>

                    <tr>
                        <td style="font-size: 13px; color: #888888; padding-bottom: 10px;">
                            <span style="font-weight: bold; color: #337ab7;">📂 {Kategori}</span>
                            <span style="margin: 0 10px;">|</span>
                            📅 {Tanggal}
                        </td>
                    </tr>

                    <tr>
                        <td style="padding-bottom: 15px;">
                            <a href="{LinkDetail}" target="_blank" style="font-size: 20px; font-weight: bold; color: #333333; text-decoration: none; line-height: 1.3;">
                                {Judul}
                            </a>
                        </td>
                    </tr>

                    <tr>
                        <td style="font-size: 14px; color: #666666; line-height: 1.6; padding-bottom: 20px;">
                            {ShortContent}
                        </td>
                    </tr>

                    <tr>
                        <td>
                            <a href="{LinkDetail}" target="_blank" style="background-color: #337ab7; color: #ffffff; padding: 10px 20px; text-decoration: none; font-size: 14px; font-weight: bold; display: inline-block; border-radius: 4px;">
                                Read More &raquo;
                            </a>
                        </td>
                    </tr>

                </table>
            </td>
        </tr>
    </table>
</body>
</html>
